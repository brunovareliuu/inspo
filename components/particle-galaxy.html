<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Particle Galaxy</title>
<script>
(function(){var q=new URLSearchParams(location.search);['bg','fg','muted','accent','accent2'].forEach(function(k){var v=q.get(k);if(v)document.documentElement.style.setProperty('--'+k,v)});var fd=q.get('fontDisplay'),fb=q.get('fontBody');if(fd||fb){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+[fd,fb].filter(Boolean).map(function(f){return 'family='+encodeURIComponent(f)+':wght@400;500;600;700'}).join('&')+'&display=swap';document.head.appendChild(l);if(fd)document.documentElement.style.setProperty('--font-display','"'+fd+'"');if(fb)document.documentElement.style.setProperty('--font-body','"'+fb+'"')}})();

<style>
:root{--bg:#040409;--fg:#f4f1ea;--muted:#7d7a8c;--accent:#ff9b54;--accent2:#5b6cff;--font-display:"Space Grotesk";--font-body:"JetBrains Mono"}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(70% 70% at 50% 50%,color-mix(in oklab,var(--accent2) 10%,var(--bg)),var(--bg) 70%);color:var(--fg);font-family:var(--font-body),ui-monospace,monospace;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,3vw,40px)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;font-size:clamp(9px,.78vw,11.5px);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row b{color:var(--fg);font-weight:500}
.brand{display:flex;align-items:center;gap:.8em}
.brand svg{width:1.6em;height:1.6em}
h1{margin:0 0 .25em;font-family:var(--font-display),system-ui,sans-serif;font-weight:300;font-size:clamp(30px,6.4vw,104px);line-height:.95;letter-spacing:-.045em}
h1 span{color:var(--accent)}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.lede{margin:0;max-width:34ch;font-size:clamp(10px,.85vw,12.5px);line-height:1.6;color:var(--muted);letter-spacing:.02em}
.stat{text-align:right;font-size:clamp(9px,.78vw,11.5px);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.8}
.stat b{display:block;color:var(--fg);font-family:var(--font-display),sans-serif;font-weight:300;font-size:clamp(20px,2.4vw,36px);letter-spacing:-.02em;text-transform:none}
@media (max-width:700px){.row .coords,.stat,.lede{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div class="ui">
  <div class="row">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10.5" ry="4.2" transform="rotate(-24 12 12)"/></svg><b>Meridian</b></div>
    <div class="coords">RA 17h 45m 40s &nbsp;/&nbsp; Dec −29° 00′ 28″</div>
    <div>Observatory <b>&nbsp;01</b></div>
  </div>
  <div>
    <h1>Chart the<br><span>unknown</span>.</h1>
    <div class="bottom">
      <p class="lede">A living survey of the night sky. Every point is a star, every arm a million years of motion.</p>
      <div class="stat"><b>40,000</b>Stars in view</div>
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
function cssColor(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  probe.clearRect(0, 0, 1, 1); probe.fillStyle = fallback; probe.fillStyle = v; probe.fillRect(0, 0, 1, 1);
  const d = probe.getImageData(0, 0, 1, 1).data;
  return new THREE.Color().setRGB(d[0] / 255, d[1] / 255, d[2] / 255, THREE.SRGBColorSpace);
}
const C = { fg: cssColor('--fg', '#f4f1ea'), a: cssColor('--accent', '#ff9b54'), b: cssColor('--accent2', '#5b6cff'), muted: cssColor('--muted', '#7d7a8c') };

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: 'high-performance' });
const PR = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(PR);
renderer.setClearColor(0x000000, 0);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
const galaxy = new THREE.Group();
galaxy.rotation.set(0.42, 0, 0.18);
scene.add(galaxy);

// deterministic RNG so every load looks the same
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v); };

const N = 40000, R = 5.2, ARMS = 3, SPIN = 1.15;
const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), scl = new Float32Array(N), ph = new Float32Array(N);
const core = C.fg.clone().lerp(C.a, 0.5), tmp = new THREE.Color();
for (let i = 0; i < N; i++) {
  let x, y, z, t;
  if (i < N * 0.09) { // bulge
    const r = Math.abs(gauss()) * 0.55;
    const th = rnd() * Math.PI * 2, ph2 = Math.acos(2 * rnd() - 1);
    x = r * Math.sin(ph2) * Math.cos(th); y = r * Math.cos(ph2) * 0.55; z = r * Math.sin(ph2) * Math.sin(th);
    t = r / R;
  } else {
    const r = Math.pow(rnd(), 1.5) * R + 0.25;
    const a = ((i % ARMS) / ARMS) * Math.PI * 2 + r * SPIN;
    const spread = 0.1 + r * 0.075;
    x = Math.cos(a) * r + gauss() * spread;
    z = Math.sin(a) * r + gauss() * spread;
    y = gauss() * (0.06 + 0.25 * Math.exp(-r * r * 0.5));
    t = r / R;
  }
  pos.set([x, y, z], i * 3);
  tmp.copy(core).lerp(C.a, Math.min(1, t * 2.4)).lerp(C.b, Math.max(0, Math.min(1, (t - 0.3) * 1.6)));
  if (rnd() < 0.06) tmp.lerp(C.fg, 0.7);
  col.set([tmp.r, tmp.g, tmp.b], i * 3);
  scl[i] = (rnd() < 0.02 ? 2.4 : 0.55 + rnd() * 0.8) * (t < 0.12 ? 0.7 : 1);
  ph[i] = rnd() * 6.2831;
}

const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
starGeo.setAttribute('aScale', new THREE.BufferAttribute(scl, 1));
starGeo.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));

const uniforms = { uTime: { value: 0 }, uSize: { value: 26 * PR }, uAlpha: { value: 1.0 } };
const pointsMat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
  vertexShader: /* glsl */`
    uniform float uTime; uniform float uSize;
    attribute float aScale; attribute float aPhase;
    varying vec3 vCol; varying float vTw;
    void main(){
      vec3 p = position;
      float r = length(p.xz);
      float a = uTime * (0.05 + 0.05 / (r + 0.6));
      float s = sin(a), c = cos(a);
      p.xz = mat2(c, -s, s, c) * p.xz;
      p.y += sin(uTime * .6 + aPhase) * 0.015;
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize * aScale / -mv.z;
      vCol = color;
      vTw = .75 + .25 * sin(uTime * 2. + aPhase * 5.);
    }`,
  fragmentShader: /* glsl */`
    uniform float uAlpha;
    varying vec3 vCol; varying float vTw;
    void main(){
      float d = length(gl_PointCoord - .5);
      float a = smoothstep(.5, .0, d);
      a = pow(a, 2.2);
      gl_FragColor = vec4(vCol, a * uAlpha * vTw);
      #include <colorspace_fragment>
    }`,
});
galaxy.add(new THREE.Points(starGeo, pointsMat));

// nebula haze: few big faint sprites along the arms
const H = 900, hp = new Float32Array(H * 3), hc = new Float32Array(H * 3), hs = new Float32Array(H), hph = new Float32Array(H);
for (let i = 0; i < H; i++) {
  const r = Math.pow(rnd(), 1.2) * R * 0.9 + 0.2;
  const a = ((i % ARMS) / ARMS) * Math.PI * 2 + r * SPIN + gauss() * 0.15;
  hp.set([Math.cos(a) * r + gauss() * .3, gauss() * .08, Math.sin(a) * r + gauss() * .3], i * 3);
  tmp.copy(C.a).lerp(C.b, Math.min(1, r / R * 1.4));
  hc.set([tmp.r, tmp.g, tmp.b], i * 3);
  hs[i] = 14 + rnd() * 16; hph[i] = rnd() * 6.28;
}
const hazeGeo = new THREE.BufferGeometry();
hazeGeo.setAttribute('position', new THREE.BufferAttribute(hp, 3));
hazeGeo.setAttribute('color', new THREE.BufferAttribute(hc, 3));
hazeGeo.setAttribute('aScale', new THREE.BufferAttribute(hs, 1));
hazeGeo.setAttribute('aPhase', new THREE.BufferAttribute(hph, 1));
const hazeMat = pointsMat.clone();
hazeMat.uniforms = { uTime: uniforms.uTime, uSize: uniforms.uSize, uAlpha: { value: 0.035 } };
galaxy.add(new THREE.Points(hazeGeo, hazeMat));

// distant background stars
const B = 2500, bp = new Float32Array(B * 3), bc = new Float32Array(B * 3), bs = new Float32Array(B), bph = new Float32Array(B);
for (let i = 0; i < B; i++) {
  const th = rnd() * Math.PI * 2, u = 2 * rnd() - 1, s = Math.sqrt(1 - u * u), r = 40 + rnd() * 30;
  bp.set([Math.cos(th) * s * r, u * r, Math.sin(th) * s * r], i * 3);
  tmp.copy(C.muted).lerp(C.fg, rnd() * .6);
  bc.set([tmp.r, tmp.g, tmp.b], i * 3);
  bs[i] = 3 + rnd() * 5; bph[i] = rnd() * 6.28;
}
const bgGeo = new THREE.BufferGeometry();
bgGeo.setAttribute('position', new THREE.BufferAttribute(bp, 3));
bgGeo.setAttribute('color', new THREE.BufferAttribute(bc, 3));
bgGeo.setAttribute('aScale', new THREE.BufferAttribute(bs, 1));
bgGeo.setAttribute('aPhase', new THREE.BufferAttribute(bph, 1));
const bgMat = pointsMat.clone();
bgMat.uniforms = { uTime: uniforms.uTime, uSize: uniforms.uSize, uAlpha: { value: 0.9 } };
const bgStars = new THREE.Points(bgGeo, bgMat);
scene.add(bgStars);

let baseDist = 9;
function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = asp;
  baseDist = asp < 1 ? 9 / Math.max(asp, .55) : 8.2;
  galaxy.position.x = asp > 1.3 ? 1.1 : 0;
  uniforms.uSize.value = 26 * PR * Math.sqrt(Math.max(h, 300) / 720);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const mouse = new THREE.Vector2(), target = new THREE.Vector2();
let lastMove = -10;
addEventListener('pointermove', e => { target.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); lastMove = clock; });

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduce ? .25 : 1;
let clock = 6, raf = 0, last = 0, paused = false;

function frame(now) {
  raf = 0;
  const dt = Math.max(0, Math.min((now - last) / 1000, 1 / 20)) * SPEED; last = now;
  clock += dt;
  if (clock - lastMove > 2.5) target.set(Math.sin(clock * .21) * .5, Math.sin(clock * .16 + 1) * .35);
  mouse.lerp(target, 1 - Math.pow(.08, dt));
  uniforms.uTime.value = clock;
  galaxy.rotation.y = -clock * 0.04;
  camera.position.set(mouse.x * 1.4, 1.6 + mouse.y * 1.0, baseDist);
  camera.lookAt(galaxy.position.x * .55, 0, 0);
  bgStars.rotation.y = clock * .004;
  renderer.render(scene, camera);
  schedule();
}
function schedule() { if (!raf && !paused && !document.hidden) raf = requestAnimationFrame(frame); }
function start() { if (!raf) { last = performance.now(); schedule(); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
addEventListener('message', e => { if (e.data === 'inspo:pause') { paused = true; stop(); } if (e.data === 'inspo:play') { paused = false; start(); } });
start();
</script>
</body>
