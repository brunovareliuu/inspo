<body>
<div class="ui">
  <div class="top">

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const root = document.documentElement;
const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
function cssRaw(name, fallback) { return getComputedStyle(root).getPropertyValue(name).trim() || fallback; }
function cssColor(name, fallback) {
  const v = cssRaw(name, fallback);
  probe.clearRect(0, 0, 1, 1); probe.fillStyle = fallback; probe.fillStyle = v; probe.fillRect(0, 0, 1, 1);
  const d = probe.getImageData(0, 0, 1, 1).data;
  return new THREE.Color().setRGB(d[0] / 255, d[1] / 255, d[2] / 255, THREE.SRGBColorSpace);
}
const C = { bg: cssColor('--bg', '#0c0c0e'), fg: cssColor('--fg', '#efebe3'), a: cssColor('--accent', '#3d7bff'), b: cssColor('--accent2', '#ff7a45'), muted: cssColor('--muted', '#85828c') };
const fontFamily = cssRaw('--font-display', '"Instrument Serif"');
try { await Promise.race([document.fonts.load(`italic 400 200px ${fontFamily}`), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = C.bg.clone();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 9);

// --- backdrop: one opaque plane (bg + colour orbs + giant word) so the transmission pass refracts it ---
const wordCanvas = document.createElement('canvas');
const wordTex = new THREE.CanvasTexture(wordCanvas);
wordTex.colorSpace = THREE.SRGBColorSpace;
wordTex.anisotropy = 4;
const backU = {
  uWord: { value: wordTex }, uBg: { value: C.bg }, uFg: { value: C.fg }, uA: { value: C.a }, uB: { value: C.b },
  uOrbA: { value: new THREE.Vector2() }, uOrbB: { value: new THREE.Vector2() }, uAspect: { value: 1 }, uShift: { value: new THREE.Vector2() },
};
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  uniforms: backU, toneMapped: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `
    uniform sampler2D uWord; uniform vec3 uBg, uFg, uA, uB; uniform vec2 uOrbA, uOrbB, uShift; uniform float uAspect;
    varying vec2 vUv;
    float orb(vec2 c, float r){ vec2 d = (vUv - c) * vec2(uAspect, 1.); return pow(clamp(1. - length(d) / r, 0., 1.), 1.9); }
    void main(){
      vec3 col = uBg;
      col = mix(col, uA, orb(uOrbA, .46) * .85);
      col = mix(col, uB, orb(uOrbB, .4) * .75);
      float w = texture2D(uWord, vUv + uShift).a;
      col = mix(col, uFg, w);
      gl_FragColor = vec4(col, 1.);
      #include <colorspace_fragment>
    }`,
}));
backdrop.position.z = -3;
scene.add(backdrop);

function drawWord(aspect) {
  const W = Math.min(2560, Math.round(innerWidth * renderer.getPixelRatio()));
  const H = Math.round(W / aspect);
  wordCanvas.width = W; wordCanvas.height = H;
  const g = wordCanvas.getContext('2d');
  g.clearRect(0, 0, W, H);
  const fg = cssRaw('--fg', '#efebe3');
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  let size = W * 0.26;
  g.font = `italic 400 ${size}px ${fontFamily}, Georgia, serif`;
  const m = g.measureText('Clarity');
  size *= Math.min(1, (W * 0.84) / m.width, (H * 0.62) / (size * 0.9));
  g.font = `italic 400 ${size}px ${fontFamily}, Georgia, serif`;
  g.fillText('Clarity', W / 2, H / 2 + size * 0.3);
  wordTex.needsUpdate = true;
}

// --- the knot ---
const accentTint = C.fg.clone().lerp(C.a, 0.12);
const glass = new THREE.MeshPhysicalMaterial({
  color: accentTint, metalness: 0, roughness: 0.015,
  transmission: 1, thickness: 0.9, ior: 1.5, dispersion: 4,
  iridescence: .7, iridescenceIOR: 1.3, iridescenceThicknessRange: [120, 700],
  clearcoat: 1, clearcoatRoughness: 0.05,
  attenuationColor: C.fg.clone().lerp(C.a, 0.35), attenuationDistance: 3,
  specularIntensity: 1, envMapIntensity: 1.25,
});
const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.36, 360, 64, 2, 3), glass);
scene.add(knot);
const key = new THREE.DirectionalLight(C.fg, 2.2); key.position.set(-3, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(C.b, 1.6); rim.position.set(4, -2, -2); scene.add(rim);

function visibleSize(z) {
  const d = camera.position.z - z;
  const h = 2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return [h * camera.aspect, h];
}
let knotScale = 1;
function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = asp; camera.updateProjectionMatrix();
  const [ww, wh] = visibleSize(backdrop.position.z);
  backdrop.scale.set(ww * 1.06, wh * 1.06, 1);
  backU.uAspect.value = asp;
  drawWord(asp);
  knotScale = asp < 1 ? Math.max(0.6, asp) : Math.min(1.05, 0.8 + asp * 0.1);
  knot.scale.setScalar(knotScale);
  renderer.render(scene, camera);
}
addEventListener('resize', resize); resize();

const mouse = new THREE.Vector2(), target = new THREE.Vector2();
let lastMove = -10;
addEventListener('pointermove', e => { target.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); lastMove = clock; });

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduce ? .25 : 1;
let clock = 2, raf = 0, last = 0, paused = false;

function frame(now) {
  raf = 0;
  const dt = Math.max(0, Math.min((now - last) / 1000, 1 / 20)) * SPEED; last = now;
  clock += dt;
  if (clock - lastMove > 2.5) target.set(Math.sin(clock * .3) * .45, Math.cos(clock * .21) * .3);
  mouse.lerp(target, 1 - Math.pow(.05, dt));
  knot.rotation.x = clock * 0.16 + mouse.y * 0.35;
  knot.rotation.y = clock * 0.22 + mouse.x * 0.45;
  knot.position.y = Math.sin(clock * 0.8) * 0.12;
  backU.uOrbA.value.set(.32 + Math.sin(clock * .23) * .06 - mouse.x * .03, .62 + Math.cos(clock * .19) * .06 - mouse.y * .03);
  backU.uOrbB.value.set(.7 + Math.cos(clock * .17) * .06 - mouse.x * .03, .36 + Math.sin(clock * .27) * .06 - mouse.y * .03);
  backU.uShift.value.set(mouse.x * .008, mouse.y * .008);
  renderer.render(scene, camera);
  schedule();
}
function schedule() { if (!raf && !paused && !document.hidden) raf = requestAnimationFrame(frame); }
function start() { if (!raf) { last = performance.now(); schedule(); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
addEventListener('message', e => { if (e.data === 'inspo:pause') { paused = true; stop(); } if (e.data === 'inspo:play') { paused = false; start(); } });
start();
</script>
