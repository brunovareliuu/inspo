<!doctype html>
<html lang="en">

<script>
(function(){var q=new URLSearchParams(location.search);['bg','fg','muted','accent','accent2'].forEach(function(k){var v=q.get(k);if(v)document.documentElement.style.setProperty('--'+k,v)});var fd=q.get('fontDisplay'),fb=q.get('fontBody');if(fd||fb){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+[fd,fb].filter(Boolean).map(function(f){return 'family='+encodeURIComponent(f)+':wght@400;500;600;700'}).join('&')+'&display=swap';document.head.appendChild(l);if(fd)document.documentElement.style.setProperty('--font-display','"'+fd+'"');if(fb)document.documentElement.style.setProperty('--font-body','"'+fb+'"')}})();

<style>
:root{--bg:#07060d;--fg:#f5f0ff;--muted:#8d86a8;--accent:#ff3d8b;--accent2:#ffb347;--font-display:"Unbounded";--font-body:"JetBrains Mono"}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body),ui-monospace,monospace;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.35}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;padding:clamp(16px,3vw,40px);text-align:center}
.top{width:100%;display:flex;justify-content:space-between;font-size:clamp(9px,.8vw,11.5px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top b{color:var(--fg);font-weight:500}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);margin-right:.7em;vertical-align:.05em}
.hero{margin-top:clamp(14px,7vh,90px)}
h1{margin:0;font-family:var(--font-display),system-ui,sans-serif;font-weight:300;font-size:clamp(24px,5.4vw,86px);line-height:1;letter-spacing:-.04em;text-transform:uppercase}
h1 em{font-style:normal;font-weight:500;background:linear-gradient(180deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:clamp(10px,1.6vw,22px) auto 0;font-size:clamp(10px,.9vw,13px);letter-spacing:.06em;color:var(--muted);max-width:44ch;line-height:1.6}
@media (max-width:700px){.top .mid,.sub{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div class="scan"></div>
<div class="ui">
  <div class="top"><div><span class="dot"></span><b>Horizon</b> OS</div><div class="mid">Sector 7G &nbsp;·&nbsp; Signal nominal</div><div>v2.049</div></div>
  <div class="hero">
    <h1>Ride the<br><em>next wave</em></h1>
    <p class="sub">Infrastructure for the frontier. Deploy anywhere the map runs out.</p>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
function cssColor(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  probe.clearRect(0, 0, 1, 1); probe.fillStyle = fallback; probe.fillStyle = v; probe.fillRect(0, 0, 1, 1);
  const d = probe.getImageData(0, 0, 1, 1).data;
  return new THREE.Color().setRGB(d[0] / 255, d[1] / 255, d[2] / 255, THREE.SRGBColorSpace);
}
const C = { bg: cssColor('--bg', '#07060d'), fg: cssColor('--fg', '#f5f0ff'), a: cssColor('--accent', '#ff3d8b'), b: cssColor('--accent2', '#ffb347') };

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = C.bg.clone();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);

const W = 16, ZN = 8, ZF = -52, COLS = 64, ROWS = 80;
const SP = (ZN - ZF) / ROWS, SPEED = 2.2;

const shared = { uTime: { value: 0 }, uA: { value: C.a }, uB: { value: C.b }, uBg: { value: C.bg }, uFg: { value: C.fg } };
const heightGLSL = /* glsl */`
  uniform float uTime;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
  float fbm(vec2 p){ float s = 0., a = .5; for(int i=0;i<4;i++){ s += a * vnoise(p); p *= 2.03; a *= .5; } return s; }
  const float SP = ${SP.toFixed(5)}; const float SPEED = ${SPEED.toFixed(2)};
  vec3 terrain(vec3 p){
    float shift = mod(uTime * SPEED, SP);
    float z = p.z + shift;
    float wz = p.z - (uTime * SPEED - shift); // constant per line within one period -> seamless loop
    float ax = abs(p.x);
    float valley = smoothstep(1.4, 7.5, ax);
    float h = fbm(vec2(p.x * .22, wz * .16)) ;
    h = pow(h, 1.6) * 7.0 * valley + (fbm(vec2(p.x * .9, wz * .6)) - .5) * .18;
    return vec3(p.x, h, z);
  }`;

// wire lines
const verts = [];
for (let j = 0; j <= ROWS; j++) {
  const z = ZF + j * SP;
  for (let i = 0; i <= COLS; i++) {
    const x = -W + (i / COLS) * 2 * W, x2 = -W + ((i + 1) / COLS) * 2 * W;
    if (i < COLS) verts.push(x, 0, z, x2, 0, z);
    if (j < ROWS) verts.push(x, 0, z, x, 0, z + SP);
  }
}
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
const lineMat = new THREE.ShaderMaterial({
  uniforms: shared, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: heightGLSL + /* glsl */`
    varying float vH; varying float vDepth; varying float vX;
    void main(){
      vec3 p = terrain(position);
      vH = p.y; vX = abs(p.x);
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uA, uB, uFg;
    varying float vH; varying float vDepth; varying float vX;
    void main(){
      vec3 col = mix(uA, uB, smoothstep(.4, 4.5, vH));
      col = mix(col, uFg, smoothstep(5.5, 7., vH) * .5);
      float fade = smoothstep(58., 18., vDepth) * smoothstep(.2, 2.5, vDepth);
      float road = 1. - smoothstep(1.2, .0, vX) * .35;
      gl_FragColor = vec4(col, fade * road * .95);
      #include <colorspace_fragment>
    }`,
});
const lines = new THREE.LineSegments(lineGeo, lineMat);
lines.renderOrder = 3;

// solid fill that hides the sun behind mountains
const fillGeo = new THREE.PlaneGeometry(2 * W, ZN - ZF, COLS, ROWS);
fillGeo.rotateX(-Math.PI / 2);
fillGeo.translate(0, 0, (ZN + ZF) / 2);
const fillMat = new THREE.ShaderMaterial({
  uniforms: shared, transparent: true,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
  vertexShader: heightGLSL + /* glsl */`
    varying float vDepth; varying float vH;
    void main(){ vec3 p = terrain(position); vH = p.y; vec4 mv = modelViewMatrix * vec4(p, 1.); vDepth = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: /* glsl */`
    uniform vec3 uBg, uA; varying float vDepth; varying float vH;
    void main(){
      vec3 col = mix(uBg, uA, .006 + smoothstep(0., 6., vH) * .02);
      gl_FragColor = vec4(col, smoothstep(60., 40., vDepth));
      #include <colorspace_fragment>
    }`,
});
const fill = new THREE.Mesh(fillGeo, fillMat);
fill.renderOrder = 2;

// sky glow + striped sun
const sky = new THREE.Mesh(new THREE.PlaneGeometry(400, 120), new THREE.ShaderMaterial({
  uniforms: shared, depthWrite: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: /* glsl */`
    uniform vec3 uBg, uA, uB; varying vec3 vP;
    void main(){
      float y = vP.y;
      float g = exp(-abs(y - 2.) * .09);
      vec3 col = mix(uBg, uA, g * g * .2);
      col = mix(col, uB, exp(-abs(y - 1.) * .5) * .07);
      gl_FragColor = vec4(col, 1.);
      #include <colorspace_fragment>
    }`,
}));
sky.position.set(0, 0, -70); sky.renderOrder = 0;

const sun = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  uniforms: shared, transparent: true, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: /* glsl */`
    uniform vec3 uA, uB; uniform float uTime; varying vec2 vUv;
    void main(){
      vec2 p = vUv * 2. - 1.;
      float r = length(p);
      float disc = smoothstep(.5, .49, r);
      float glow = pow(clamp(1. - r, 0., 1.), 3.) * .55;
      float y = vUv.y;
      vec3 col = mix(uA, uB, smoothstep(.3, .72, y));
      // stripes that grow toward the bottom and drift down
      float band = fract(y * 9. + uTime * .25);
      float thick = smoothstep(.72, .2, y) * .62;
      float cut = step(band, thick) * step(y, .72);
      float a = disc * (1. - cut) + glow * (1. - disc);
      gl_FragColor = vec4(col, a);
      #include <colorspace_fragment>
    }`,
}));
sun.renderOrder = 1;

// stars
const S = 500, sp = new Float32Array(S * 3);
let seed = 3; const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
for (let i = 0; i < S; i++) sp.set([(rnd() - .5) * 220, 4 + Math.pow(rnd(), .7) * 60, -66], i * 3);
const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: C.fg, size: 1.4, sizeAttenuation: false, transparent: true, opacity: .55, depthWrite: false }));
stars.renderOrder = 0;
scene.add(sky, stars, sun, fill, lines);

function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = asp;
  camera.fov = asp < 1 ? 75 : 60;
  camera.updateProjectionMatrix();
  const sunSize = 27;
  sun.scale.setScalar(sunSize);
  sun.position.set(0, 4.2, -64);
}
addEventListener('resize', resize); resize();

const mouse = new THREE.Vector2(), target = new THREE.Vector2();
let lastMove = -10;
addEventListener('pointermove', e => { target.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); lastMove = clock; });

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RATE = reduce ? .25 : 1;
let clock = 0, raf = 0, last = 0, paused = false;
function frame(now) {
  raf = 0;
  const dt = Math.max(0, Math.min((now - last) / 1000, 1 / 20)) * RATE; last = now;
  clock += dt;
  if (clock - lastMove > 2.5) target.set(Math.sin(clock * .25) * .5, Math.sin(clock * .17) * .3);
  mouse.lerp(target, 1 - Math.pow(.1, dt));
  shared.uTime.value = clock;
  camera.position.set(mouse.x * 1.2, 1.35 + mouse.y * .35, 6);
  camera.lookAt(mouse.x * 2.5, 2.3, -30);
  camera.rotateZ(-mouse.x * .04);
  renderer.render(scene, camera);
  schedule();
}
function schedule() { if (!raf && !paused && !document.hidden) raf = requestAnimationFrame(frame); }
function start() { if (!raf) { last = performance.now(); schedule(); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
addEventListener('message', e => { if (e.data === 'inspo:pause') { paused = true; stop(); } if (e.data === 'inspo:play') { paused = false; start(); } });
start();
</script>
