name: I have an idea
description: A source, style, component or feature inspo is missing.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to be able to do?
      description: The problem it solves, more than the solution.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How do you picture it?
  - type: input
    id: example
    attributes:
      label: An example
      description: A gallery, site or product that does something like it.
