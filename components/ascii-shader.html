<style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<body>
<div class="ui">
  <div class="row"><div><b>donut</b>.sh</div><div class="mid">render: glyph atlas &nbsp;·&nbsp; <span class="on">● live</span></div><div>v0.9.3</div></div>
  <div class="bottom">
    <h1>Every pixel<br>is a <em>character</em>.</h1>
    <div class="term"><i>$</i> npx donut --ascii<br><b>✓</b> 1 mesh · 2 lights · 15 glyphs<br><b>✓</b> ready in 4ms <span class="caret"></span></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

const root = document.documentElement;
const cssRaw = (n, f) => getComputedStyle(root).getPropertyValue(n).trim() || f;
const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
function cssColor(name, fallback) {
  const v = cssRaw(name, fallback);
  probe.clearRect(0, 0, 1, 1); probe.fillStyle = fallback; probe.fillStyle = v; probe.fillRect(0, 0, 1, 1);
  const d = probe.getImageData(0, 0, 1, 1).data;
  return new THREE.Color().setRGB(d[0] / 255, d[1] / 255, d[2] / 255, THREE.SRGBColorSpace);
}
const C = { bg: cssColor('--bg', '#0a0a09'), fg: cssColor('--fg', '#f1eee4'), muted: cssColor('--muted', '#6f6c63'), a: cssColor('--accent', '#c6ff3d'), b: cssColor('--accent2', '#2f7d5b') };

// ---------- glyph atlas ----------
const CHARS = ' .,:;-=+*ox%#&@';
const monoFont = '"JetBrains Mono", ui-monospace, monospace';
try { await Promise.race([document.fonts.load(`500 88px ${monoFont}`), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
const GW = 64, GH = 104;
const atlasCanvas = document.createElement('canvas');
atlasCanvas.width = GW * CHARS.length; atlasCanvas.height = GH;
const g = atlasCanvas.getContext('2d');
g.fillStyle = '#000'; g.fillRect(0, 0, atlasCanvas.width, GH);
g.fillStyle = '#fff'; g.font = `500 84px ${monoFont}`; g.textAlign = 'center'; g.textBaseline = 'middle';
[...CHARS].forEach((c, i) => g.fillText(c, i * GW + GW / 2, GH / 2 + 4));
const atlas = new THREE.CanvasTexture(atlasCanvas);
atlas.minFilter = THREE.LinearFilter; atlas.generateMipmaps = false;

// ---------- 3D scene (rendered small, into a target) ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(PR);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
camera.position.set(0, 0, 7);
const donut = new THREE.Mesh(new THREE.TorusGeometry(1.1, .5, 64, 160), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .35, metalness: 0 }));
scene.add(donut);
const key = new THREE.DirectionalLight(0xffffff, 2.3); key.position.set(-3, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, .7); rim.position.set(4, -2, -3); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, .04));

const rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true });

// ---------- ASCII pass ----------
const post = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const U = {
  tScene: { value: rt.texture }, tAtlas: { value: atlas }, uCells: { value: new THREE.Vector2() }, uCount: { value: CHARS.length },
  uTime: { value: 0 }, uMouse: { value: new THREE.Vector2(-1, -1) },
  uBg: { value: C.bg }, uFg: { value: C.fg }, uA: { value: C.a }, uB: { value: C.b }, uMuted: { value: C.muted },
};
post.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: /* glsl */`
    uniform sampler2D tScene, tAtlas; uniform vec2 uCells, uMouse; uniform float uCount, uTime;
    uniform vec3 uBg, uFg, uA, uB, uMuted;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    float glyph(float idx, vec2 local){ return texture2D(tAtlas, vec2((idx + clamp(local.x, .02, .98)) / uCount, local.y)).r; }
    void main(){
      vec2 grid = vUv * uCells;
      vec2 cell = floor(grid), local = fract(grid);
      vec3 s = texture2D(tScene, (cell + .5) / uCells).rgb;
      float l = pow(clamp(dot(s, vec3(.2126, .7152, .0722)), 0., 1.), 1. / 2.2);
      // soft scan line sweeping down
      float scan = exp(-pow((vUv.y - (1. - fract(uTime * .09))) * 9., 2.));
      // cursor lens boosts nearby cells
      float lens = smoothstep(.16, .0, distance(vUv * vec2(uCells.x / uCells.y * .6, 1.), uMouse * vec2(uCells.x / uCells.y * .6, 1.)));
      float lb = clamp(l + scan * .12 * step(.04, l) + lens * .25 * step(.04, l), 0., 1.);
      float idx = floor(lb * (uCount - 1.) + .5);
      float gl = glyph(idx, local);
      vec3 col = mix(uB, uA, smoothstep(.12, .62, lb));
      col = mix(col, uFg, smoothstep(.72, .98, lb));
      vec3 outc = mix(uBg, col, gl);
      // sparse twinkling dust in empty space
      float dust = step(lb, .03) * step(.992, hash(cell + floor(uTime * 1.5 + hash(cell) * 3.)));
      outc = mix(outc, uMuted, glyph(1., local) * dust * .8);
      gl_FragColor = vec4(outc, 1.);
      #include <colorspace_fragment>
    }`,
})));

let cellCss = 10;
function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = asp;
  camera.position.z = asp < 1 ? 7 / Math.max(asp, .5) : 7;
  camera.updateProjectionMatrix();
  cellCss = Math.max(8, Math.min(15, Math.round(Math.min(w, h * 1.4) / 84)));
  const ch = cellCss, cw = cellCss * (GW / GH);
  U.uCells.value.set(w / cw, h / ch);
  rt.setSize(Math.ceil(w / cw) * 2, Math.ceil(h / ch) * 2);
  donut.position.x = asp > 1.2 ? .95 : 0;
  donut.position.y = asp > 1.2 ? .1 : .35;
}
addEventListener('resize', resize); resize();

const mouse = new THREE.Vector2(), target = new THREE.Vector2();
let lastMove = -10;
addEventListener('pointermove', e => { target.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight); lastMove = clock; });
addEventListener('pointerleave', () => { lastMove = -10; });

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RATE = reduce ? .25 : 1;
let clock = 3.6, raf = 0, last = 0, paused = false;
function frame(now) {
  raf = 0;
  const dt = Math.max(0, Math.min((now - last) / 1000, 1 / 20)) * RATE; last = now;
  clock += dt;
  const idle = clock - lastMove > 2.5;
  if (idle) target.set(.5 + Math.sin(clock * .4) * .3, .5 + Math.cos(clock * .31) * .25);
  mouse.lerp(target, 1 - Math.pow(.02, dt));
  donut.rotation.x = .55 + Math.sin(clock * .4) * .35 - (mouse.y - .5) * .5;
  donut.rotation.y = clock * .5 + (mouse.x - .5) * .6;
  donut.rotation.z = clock * .15;
  U.uTime.value = clock;
  U.uMouse.value.copy(idle ? new THREE.Vector2(-5, -5) : mouse);
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(post, postCam);
  schedule();
}
function schedule() { if (!raf && !paused && !document.hidden) raf = requestAnimationFrame(frame); }
function start() { if (!raf) { last = performance.now(); schedule(); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
addEventListener('message', e => { if (e.data === 'inspo:pause') { paused = true; stop(); } if (e.data === 'inspo:play') { paused = false; start(); } });
start();
</script>
</body>
