<body>
<div class="ui">
  <div class="top"><div class="brand"><i></i>Softbody</div><nav><a>Product</a><a>Showcase</a><a>Pricing</a></nav><div class="btn">Get started</div></div>
  <div class="center"><div><h1>Design that feels<br><em>tangible.</em></h1><p>A 3D toolkit for interfaces people want to reach out and touch.</p></div></div>
  <div class="bottom"><div><b>01</b> / 04</div><div class="mid">Trusted by 12,000 product teams</div><div>Scroll to explore</div></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
function cssColor(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  probe.clearRect(0, 0, 1, 1); probe.fillStyle = fallback; probe.fillStyle = v; probe.fillRect(0, 0, 1, 1);
  const d = probe.getImageData(0, 0, 1, 1).data;
  return new THREE.Color().setRGB(d[0] / 255, d[1] / 255, d[2] / 255, THREE.SRGBColorSpace);
}
const C = { fg: cssColor('--fg', '#f4efe6'), a: cssColor('--accent', '#ff6a3d'), b: cssColor('--accent2', '#8f7bff') };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0, 0);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = .8;
pmrem.dispose();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 14);
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-4, 6, 6); scene.add(key);
const fill = new THREE.DirectionalLight(C.b, 1.2); fill.position.set(5, -3, 2); scene.add(fill);

const mat = (color, rough = .32) => new THREE.MeshPhysicalMaterial({ color, roughness: rough, metalness: 0, clearcoat: 1, clearcoatRoughness: .12, sheen: .12, sheenColor: C.fg, sheenRoughness: .5 });
const mA = mat(C.a), mB = mat(C.b), mF = mat(C.fg, .42);
const geos = {
  box: new RoundedBoxGeometry(1, 1, 1, 6, .2),
  sphere: new THREE.SphereGeometry(.6, 64, 48),
  torus: new THREE.TorusGeometry(.5, .22, 48, 96),
  capsule: new THREE.CapsuleGeometry(.3, .7, 16, 32),
  cone: new THREE.ConeGeometry(.55, .95, 64, 1),
  ring: new THREE.TorusGeometry(.42, .08, 32, 96),
};
// x,y as fraction of half-view, z depth, size, geometry, material
const layout = [
  [-.66, .5, .6, 1.25, 'box', mA],
  [.7, .52, -1.2, 1.35, 'sphere', mF],
  [.6, -.52, 1.3, 1.35, 'torus', mB],
  [-.58, -.56, -.4, 1.3, 'capsule', mB],
  [-.3, .7, -3, .7, 'sphere', mB],
  [.22, -.84, 2, .7, 'box', mF],
  [-.86, -.04, -2.2, 1.0, 'cone', mF],
  [.88, .02, -1.8, 1.0, 'ring', mA],
];
const shapes = layout.map(([x, y, z, s, g, m], i) => {
  const mesh = new THREE.Mesh(geos[g], m);
  mesh.userData = { x, y, z, s, phase: i * 1.7, spin: new THREE.Vector3((i % 3 - 1) * .25 + .15, ((i + 1) % 3 - 1) * .3 + .1, .05) };
  mesh.rotation.set(i * .7, i * 1.3, i * .4);
  scene.add(mesh);
  return mesh;
});

let vw = 1, vh = 1, unit = 1;
function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = asp; camera.updateProjectionMatrix();
  vh = camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  vw = vh * asp;
  unit = Math.min(vw * .8, vh) * .35;
  for (const m of shapes) {
    const d = m.userData, persp = (camera.position.z - d.z) / camera.position.z;
    d.bx = d.x * vw * persp; d.by = d.y * vh * persp;
    m.scale.setScalar(d.s * unit);
  }
  renderer.render(scene, camera);
}
addEventListener('resize', resize); resize();

const mouse = new THREE.Vector2(), target = new THREE.Vector2();
let lastMove = -10;
addEventListener('pointermove', e => { target.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); lastMove = clock; });

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RATE = reduce ? .25 : 1;
let clock = 1, raf = 0, last = 0, paused = false;
function frame(now) {
  raf = 0;
  const dt = Math.max(0, Math.min((now - last) / 1000, 1 / 20)) * RATE; last = now;
  clock += dt;
  if (clock - lastMove > 2.5) target.set(Math.sin(clock * .3) * .5, Math.cos(clock * .23) * .35);
  mouse.lerp(target, 1 - Math.pow(.06, dt));
  for (const m of shapes) {
    const d = m.userData, depth = (d.z + 4) * .12;
    m.position.set(
      d.bx + Math.sin(clock * .5 + d.phase) * .15 * unit + mouse.x * depth,
      d.by + Math.sin(clock * .7 + d.phase * 1.3) * .22 * unit + mouse.y * depth,
      d.z);
    m.rotation.x += d.spin.x * dt; m.rotation.y += d.spin.y * dt; m.rotation.z += d.spin.z * dt;
  }
  renderer.render(scene, camera);
  schedule();
}
function schedule() { if (!raf && !paused && !document.hidden) raf = requestAnimationFrame(frame); }
function start() { if (!raf) { last = performance.now(); schedule(); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
addEventListener('message', e => { if (e.data === 'inspo:pause') { paused = true; stop(); } if (e.data === 'inspo:play') { paused = false; start(); } });
start();
</script>
